<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conecta RH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800;900&family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pausa-activa.css">
<link rel="stylesheet" href="css/pausa-motivacional.css">
<link rel="stylesheet" href="css/campana-informativa.css">
<link rel="stylesheet" href="css/sugerencia.css">
<link rel="stylesheet" href="css/media.css">
<link rel="stylesheet" href="css/pantalla-carga.css">
<link rel="stylesheet" href="css/firma.css">
<style>
  html,body{margin:0;background:#eaf3fd}
  body.bloqueado{overflow:hidden}
  .cargando{min-height:100vh;display:grid;place-items:center}
  .cargando i{width:38px;height:38px;border-radius:50%;border:4px solid #cfe0f7;border-top-color:#1f6fd6;animation:girar .8s linear infinite}
  @keyframes girar{to{transform:rotate(360deg)}}
  [hidden]{display:none!important}
  .pa-cuenta{
    margin-top:18px;display:inline-block;padding:10px 18px;border-radius:999px;
    font-family:'Fredoka','Nunito',sans-serif;font-weight:600;font-size:18px;color:#fff;
    background:linear-gradient(120deg,#1f6fd6,#12a07c);box-shadow:0 8px 20px rgba(31,111,214,.25);
  }
</style>
</head>
<body>
  <!-- Página pública que abre el trabajador con el enlace: responder.html?e=<id> -->
  <div id="app"><div class="cargando" aria-label="Cargando"><i></i></div></div>

<script type="module">
  import { db } from "./js/firebase-config.js";
  import { estadoHorario, fechaLarga, restante, pintarLimite } from "./js/horario.js";
  import {
    doc, getDoc, addDoc, collection, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Módulo de vista de cada tipo de pausa (cada uno exporta montar y normalizar).
  const VISTAS = {
    pausa_activa: "./js/pausa-activa-vista.js",
    pausa_motivacional: "./js/pausa-motivacional-vista.js",
    campana_informativa: "./js/campana-informativa-vista.js",
    sugerencia_aprendizaje: "./js/sugerencia-vista.js"
  };

  const app = document.getElementById("app");
  const id = new URLSearchParams(location.search).get("e");

  function aviso(emo, titulo, texto) {
    app.innerHTML = `<div class="pa pa-pagina"><section class="pa-card pa-aviso">
      <div class="emo"></div><h1></h1><p></p></section></div>`;
    app.querySelector(".emo").textContent = emo;
    app.querySelector("h1").textContent = titulo;
    app.querySelector("p").textContent = texto;
  }
  const noDisponible = () => aviso("🔒", "Este enlace no está disponible",
    "Puede que la actividad haya terminado o que el enlace esté incompleto. Consulta con Recursos Humanos.");

  // Aún no abre: cuenta regresiva y, al llegar la hora, se recarga sola.
  function avisoPronto(ini) {
    aviso("⏳", "Esta pausa abre pronto", `Abre el ${fechaLarga(ini).replace(/^./, (c) => c.toLowerCase())}.`);
    const cuenta = document.createElement("div");
    cuenta.className = "pa-cuenta";
    app.querySelector(".pa-aviso").append(cuenta);
    const tic = () => {
      const falta = ini - new Date();
      if (falta <= 0) { location.reload(); return; }
      cuenta.textContent = "Faltan " + restante(falta);
    };
    tic();
    setInterval(tic, 15000);
  }

  // Momento en que la pausa queda visible (al terminar la pantalla de carga).
  let inicioPausa = Date.now();

  // "Cómo" participó: datos básicos del dispositivo y el tiempo dentro de la pausa.
  function medio() {
    const ua = navigator.userAgent;
    return {
      canal: "enlace",
      dispositivo: /Mobi|Android|iPhone|iPad/i.test(ua) ? "móvil" : "computador",
      navegador: ua.slice(0, 300),
      idioma: navigator.language || "",
      pantalla: `${screen.width}x${screen.height}`,
      duracionSeg: Math.round((Date.now() - inicioPausa) / 1000)
    };
  }

  async function iniciar() {
    if (!id) return noDisponible();

    let ed;
    try {
      const snap = await getDoc(doc(db, "ediciones", id));
      if (!snap.exists()) return noDisponible();
      ed = snap.data();
    } catch {
      return noDisponible();
    }
    if (ed.estado !== "activa") return noDisponible();

    document.title = ed.titulo || "Conecta RH";

    // Horario: antes de abrir o después de cerrar no se muestra la pausa.
    const h = estadoHorario(ed.horario);
    if (h.estado === "pronto") return avisoPronto(h.ini);
    if (h.estado === "cerrada") {
      return aviso("⏰", "Esta pausa ya cerró",
        `Estuvo disponible hasta el ${fechaLarga(h.fin).replace(/^./, (c) => c.toLowerCase())}. ¡Te esperamos en la próxima!`);
    }

    const vistaJs = VISTAS[ed.tipo];
    if (!vistaJs) return aviso("🛠️", "Muy pronto", "Este tipo de actividad aún no está disponible.");

    const [{ montar, normalizar }, { mostrarPantallaCarga }] = await Promise.all([
      import(vistaJs),
      import("./js/pantalla-carga.js")
    ]);
    const datos = normalizar(ed);
    document.body.style.background = datos.estilo.fondo;

    // La pausa se monta debajo (así el contenido va cargando) y encima va la pantalla de carga,
    // salvo que RH la haya desactivado.
    if (datos.visible?.carga !== false) {
      document.body.classList.add("bloqueado");
      mostrarPantallaCarga(document.body, { tipo: ed.tipo, frase: datos.textos.carga, estilo: datos.estilo })
        .then(() => { document.body.classList.remove("bloqueado"); inicioPausa = Date.now(); });
    }

    montar(app, ed, {
      modo: "real",
      pagina: true,
      // Cada vista entrega { nombre, cargo, contenido } (contenido = "qué hizo").
      onEnviar: async (r) => {
        try {
          await addDoc(collection(db, "registros"), {
            edicionId: id,
            propietario: ed.uid,
            tipo: ed.tipo,
            participante: { nombre: r.nombre, cargo: r.cargo },
            contenido: r.contenido,
            medio: medio(),
            creado: serverTimestamp()
          });
        } catch (e) {
          throw new Error(e.code === "permission-denied"
            ? "Esta actividad ya no recibe respuestas."
            : "No se pudo enviar. Revisa tu conexión e intenta de nuevo.");
        }
      }
    });

    // "⏰ Disponible hasta…" arriba de la pausa, al día cada 30 s.
    if (ed.horario?.activo && h.fin) {
      const pa = app.querySelector(".pa");
      pintarLimite(pa, ed.horario);
      setInterval(() => pintarLimite(pa, ed.horario), 30000);
    }
  }

  iniciar();
</script>
</body>
</html>
