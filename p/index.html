<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conecta RH</title>
<style>
  html,body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:#0f2434;
    background:linear-gradient(165deg,#eaf3fd,#e3f6ee)}
  .caja{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  .giro{width:40px;height:40px;margin:0 auto 14px;border-radius:50%;border:4px solid #cfe0f7;border-top-color:#1f6fd6;animation:g .8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  h1{font-size:20px;margin:8px 0 6px}
  p{margin:0;color:#5a6e7f;font-size:15px;line-height:1.5}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <!-- Enlace corto: p/?CODIGO → responder.html?e=<id> (ver js/compartir.js y la colección "cortos") -->
  <div class="caja">
    <div id="cargando"><div class="giro"></div><p>Abriendo la pausa…</p></div>
    <div id="error" hidden>
      <div style="font-size:46px">🔗</div>
      <h1>Este enlace no existe</h1>
      <p>Revisa que esté completo o pide uno nuevo a Recursos Humanos.</p>
    </div>
  </div>
<script type="module">
  import { db } from "../js/firebase-config.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const fallo = () => {
    document.getElementById("cargando").hidden = true;
    document.getElementById("error").hidden = false;
  };
  const codigo = decodeURIComponent(location.search.slice(1)).replace(/[^A-Za-z0-9]/g, "");
  try {
    if (!codigo) throw new Error();
    const snap = await getDoc(doc(db, "cortos", codigo));
    if (!snap.exists() || typeof snap.data().e !== "string") throw new Error();
    location.replace(new URL("../responder.html?e=" + encodeURIComponent(snap.data().e), location.href));
  } catch {
    fallo();
  }
</script>
</body>
</html>
